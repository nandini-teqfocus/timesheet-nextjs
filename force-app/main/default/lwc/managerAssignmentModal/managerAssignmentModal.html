<template>
  <div class="modal-backdrop" onclick={handleClose}></div>
  <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
          <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
          <span class="slds-assistive-text">Close</span>
        </button>
        <h2 class="slds-modal__title slds-hyphenate">Assign Hiring Manager</h2>
      </header>

      <div class="slds-modal__content slds-p-around_medium">
        <template if:true={isLoading}>
          <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        
        <p class="slds-m-bottom_medium">Select the hiring manager for {referralCount} referral(s):</p>
        
        <lightning-record-edit-form object-api-name="Employee_Referral__c">
          <lightning-input-field field-name="Hiring_Manager_Assigned__c" onchange={handleManagerChange} required></lightning-input-field>
        </lightning-record-edit-form>
      </div>

      <footer class="slds-modal__footer">
        <lightning-button label="Cancel" onclick={handleClose} class="slds-m-right_x-small"></lightning-button>
        <lightning-button label="Assign" variant="brand" onclick={handleAssign} disabled={isAssignDisabled}></lightning-button>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open"></div>
</template>
