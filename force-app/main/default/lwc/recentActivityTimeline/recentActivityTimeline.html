<template>
    <div class="activity-feed-container">
        <!-- Header Banner -->
        <div class="feed-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <div class="slds-grid slds-grid_vertical-align-center">
                <div class="feed-header-icon">
                    <lightning-icon icon-name="standard:timesheet_entry" size="small"></lightning-icon>
                </div>
                <div class="slds-m-left_small">
                    <h2 class="feed-title">Live Activity Feed</h2>
                    <p class="feed-subtitle">Real-time candidate updates and recruiter remarks</p>
                </div>
            </div>
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button-icon 
                    icon-name="utility:refresh" 
                    variant="border-filled" 
                    alternative-text="Refresh Feed" 
                    class="slds-m-right_small" 
                    onclick={handleRefresh}
                ></lightning-button-icon>
                <div class="feed-stats-badge">
                    <span class="pulse-dot"></span>
                    <span>Live Feed</span>
                </div>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_xx-large">
                <lightning-spinner alternative-text="Refreshing live feed" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="error-illustration slds-align_absolute-center slds-p-around_large">
                <div class="slds-text-align_center">
                    <lightning-icon icon-name="utility:error" variant="error" size="large"></lightning-icon>
                    <h3 class="slds-text-heading_medium slds-m-top_medium">Unable to Load Activities</h3>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">Please check back again shortly.</p>
                </div>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={activities.length}>
                <div class="timeline-container">
                    <template for:each={activities} for:item="activity">
                        <div key={activity.id} class={activity.cardClass}>
                            <!-- Accent Left Border Indicator -->
                            <div class="accent-bar"></div>

                            <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-p-around_medium card-content">
                                <!-- Col 1: Initiator Avatar (with elegant initial badge) -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-12 slds-align_absolute-center slds-m-bottom_small slds-medium-m-bottom_none">
                                    <div class="user-avatar-circle" title={activity.user}>
                                        {activity.userInitials}
                                    </div>
                                </div>

                                <!-- Col 2: Info & Details -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12 slds-p-horizontal_medium">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                        <h3 class="activity-title slds-m-right_small">{activity.title}</h3>
                                        <template if:true={activity.status}>
                                            <span class={activity.badgeClass}>{activity.status}</span>
                                        </template>
                                    </div>

                                    <!-- Description -->
                                    <p class="activity-desc slds-m-top_xx-small">
                                        <span class="meta-label">Candidate:</span> 
                                        <span class="meta-value-highlight">{activity.candidateName}</span>
                                        <template if:true={activity.jobTitle}>
                                            <span class="meta-separator">&bull;</span>
                                            <span class="meta-label">Job:</span>
                                            <span class="meta-value">{activity.jobTitle}</span>
                                        </template>
                                    </p>

                                    <!-- Meta Footer -->
                                    <div class="activity-meta-footer slds-grid slds-grid_vertical-align-center slds-m-top_x-small">
                                        <span class="meta-user">
                                            <lightning-icon icon-name="utility:user" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            By {activity.user}
                                        </span>
                                        <span class="meta-bullet">&bull;</span>
                                        <span class="meta-time">
                                            <lightning-icon icon-name="utility:clock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            {activity.relativeTime}
                                        </span>
                                    </div>
                                </div>

                                <!-- Col 3: Actions (Navigate/Details) -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                                    <template if:true={activity.referralId}>
                                        <button 
                                            class="slds-button slds-button_neutral action-btn-view"
                                            data-id={activity.referralId} 
                                            onclick={handleViewReferral}
                                        >
                                            <span>View Details</span>
                                            <lightning-icon icon-name="utility:chevronright" size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:false={activities.length}>
                <div class="empty-state slds-text-align_center slds-p-around_xx-large">
                    <lightning-icon icon-name="utility:feed" size="large" class="empty-icon"></lightning-icon>
                    <h3 class="slds-text-heading_medium slds-m-top_medium">No Recent Activities</h3>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">New comments and status updates will be displayed here in real time.</p>
                </div>
            </template>
        </template>
    </div>
</template>
