<template>
    <!-- emptyState: Illustrative SLDS fallback state -->
    <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center empty-state-container">
        <!-- Illustrative icon -->
        <lightning-icon 
            icon-name={iconName} 
            size="large" 
            class="slds-m-bottom_small empty-state-icon">
        </lightning-icon>

        <div class="slds-text-longform slds-m-top_small">
            <h3 class="slds-text-heading_small font-weight-bold">{title}</h3>
            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_xxx-small">{message}</p>
        </div>

        <!-- Optional action button -->
        <template lwc:if={actionLabel}>
            <div class="slds-m-top_medium">
                <lightning-button 
                    variant="brand" 
                    label={actionLabel} 
                    onclick={handleActionClick}>
                </lightning-button>
            </div>
        </template>
    </div>
</template>
