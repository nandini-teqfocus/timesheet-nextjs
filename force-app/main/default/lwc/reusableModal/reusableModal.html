<template>
    <!-- Renders only when isOpen is flagged as true -->
    <template lwc:if={isOpen}>
        <!-- Backdrop background mask -->
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

        <!-- Dialog layout -->
        <section 
            role="dialog" 
            tabindex="-1" 
            aria-modal="true" 
            aria-labelledby="modal-heading-id" 
            class="slds-modal slds-fade-in-open slds-modal_small">
            
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <!-- Close button in upper right corner -->
                    <button 
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                        title="Close" 
                        onclick={handleCloseClick}>
                        <lightning-icon 
                            icon-name="utility:close" 
                            size="small" 
                            variant="inverse" 
                            alternative-text="Close dialog">
                        </lightning-icon>
                    </button>
                    
                    <h2 id="modal-heading-id" class="slds-modal__title slds-hyphenate slds-text-heading_medium font-weight-bold">
                        {title}
                    </h2>
                </header>

                <!-- Modal Body scrollable panel -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id">
                    <slot></slot>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <slot name="footer">
                        <!-- Standard fallback buttons if no footer slot is passed -->
                        <button class="slds-button slds-button_neutral" onclick={handleCloseClick}>Cancel</button>
                    </slot>
                </footer>
            </div>
        </section>
    </template>
</template>
